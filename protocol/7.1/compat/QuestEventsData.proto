syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";
import "QuestEventsGivingRecord.proto";

// 7.1 IDIKPPKJIMA, carried by the native quest event evidence notification.
message QuestEventsData {
  uint32 event_id = 6;
  repeated uint32 unlocked_item_list = 10 [packed = true];
  repeated QuestEventsGivingRecord giving_record_list = 11;
}
