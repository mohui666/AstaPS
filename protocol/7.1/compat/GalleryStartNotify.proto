syntax = "proto3";
option java_package = "emu.grasscutter.net.proto";

// 7.1 CMNGOICPEOK, CmdId 20814; native parser NLGB at RVA 10D4CAD0.
// MP_BLOCK galleries use the common fields; gallery-specific oneofs are omitted.
message GalleryStartNotify {
  uint32 gallery_id = 1;
  uint32 player_count = 3;
  uint32 end_time = 9;
  uint32 owner_uid = 10;
  uint32 start_time = 11;
}
