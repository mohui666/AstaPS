<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AstaPS Console</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f8f9fb; --text: #15171c; --muted: #6a717d;
    --border: #e2e5ea; --accent: #3b5bdb; --accent-soft: #e8edff; --accent-text: #ffffff;
    --ok: #1f8a4c; --busy: #2f6fdb; --warn: #b7791f; --bad: #c92a2a;
    --ok-soft: #e6f4ec; --warn-soft: #fbf1df; --bad-soft: #fbe7e7; --busy-soft: #e7effc;
    --term-bg: #0d1016; --term-text: #d5d9e0; --term-muted: #6b7380; --term-border: #1c212b;
    --term-info: #7cb7ff; --term-warn: #f2b84b; --term-error: #ff7070; --term-debug: #8a93a3;
    --radius: 12px; --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-2: #1c2029; --text: #e7e9ee; --muted: #959cab;
      --border: #272c37; --accent: #6d8cff; --accent-soft: #1f2742; --accent-text: #0d1016;
      --ok: #4cc283; --busy: #6d9cff; --warn: #e3b04b; --bad: #ff7b7b;
      --ok-soft: #15291f; --warn-soft: #2d2414; --bad-soft: #321a1c; --busy-soft: #18233a;
      --term-bg: #0a0c10; --term-border: #20252f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); min-height: 100vh;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
    padding: 6px 12px; transition: background .15s, border-color .15s; }
  button:hover { background: var(--panel-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.primary:hover { filter: brightness(1.06); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); }

  /* Language switch */
  .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .lang button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12px; color: var(--muted); background: transparent; }
  .lang button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #8a5cf6); color: #fff; font-size: 13px; font-weight: 700; }

  /* Login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(1200px 500px at 50% -10%, var(--accent-soft), transparent 70%); }
  #login .box { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; box-shadow: var(--shadow); }
  #login .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  #login p.hint { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
  #login form { display: grid; gap: 12px; }
  #login button.primary { padding: 9px 12px; }
  #login-error { color: var(--bad); min-height: 1.5em; margin: 0; font-size: 13px; }

  /* App shell */
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  header .spacer { flex: 1; }
  header > * { flex-shrink: 0; white-space: nowrap; }
  header .spacer { flex-shrink: 1; min-width: 0; }
  @media (max-width: 600px) {
    header { gap: 10px; padding: 10px 12px; }
    header .pill { padding: 4px 6px; }
    header .pill #h-text { display: none; }
    header .brand .logo + span > span { display: none; }
  }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.NORMAL { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.BUSY { background: var(--busy); box-shadow: 0 0 0 3px var(--busy-soft); }
  .dot.WARNING { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .dot.DANGER { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }

  main { max-width: 1280px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 22px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .value.NORMAL { color: var(--ok); } .card .value.BUSY { color: var(--busy); }
  .card .value.WARNING { color: var(--warn); } .card .value.DANGER { color: var(--bad); }
  .meter { height: 4px; border-radius: 4px; background: var(--panel-2); margin-top: 10px; overflow: hidden; border: 1px solid var(--border); }
  .meter > span { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s, background .4s; }
  .meter > span.mid { background: var(--warn); } .meter > span.high { background: var(--bad); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .panel-head h2 { font-size: 14px; margin: 0; font-weight: 650; }
  .panel-head .meta { color: var(--muted); font-size: 12px; }
  .panel-head .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } header { padding: 10px 16px; } main { padding: 16px; } }

  /* Terminal and log */
  .term { background: var(--term-bg); color: var(--term-text); font: 12.5px/1.55 var(--mono); }
  .term .out { height: 300px; overflow: auto; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; }
  .term .line { padding: 1px 0; }
  .term .cmd { color: #e7e9ee; } .term .cmd::before { content: "› "; color: var(--accent); }
  .term .INFO { color: var(--term-text); } .term .ERROR { color: var(--term-error); }
  .term .DEBUG, .term .TRACE, .term .note { color: var(--term-debug); }
  .prompt { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--term-border); padding: 8px 10px 8px 14px; }
  .prompt span { color: var(--accent); font-weight: 700; }
  .prompt input { flex: 1; background: transparent; border: 0; color: var(--term-text); font: 13px var(--mono); padding: 6px 0; }
  .prompt input:focus-visible { outline: none; }
  .prompt button { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 600; }

  .log .out { height: 460px; }
  .log .row { display: grid; grid-template-columns: 64px 52px minmax(0, 1fr); gap: 10px; padding: 1px 0; }
  .log .time { color: var(--term-muted); }
  .log .lvl { font-size: 11px; font-weight: 700; letter-spacing: .3px; }
  .log .lvl.INFO { color: var(--term-info); } .log .lvl.WARN { color: var(--term-warn); }
  .log .lvl.ERROR { color: var(--term-error); } .log .lvl.DEBUG, .log .lvl.TRACE { color: var(--term-debug); }
  .log .src { color: var(--term-muted); }
  .log .row.WARN .msg { color: #f3d9a4; } .log .row.ERROR .msg { color: #ffb3b3; }
  .chips { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .chips button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 12px; color: var(--muted); background: transparent; }
  .chips button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tools input[type=text] { width: 160px; padding: 4px 10px; font-size: 12px; }
  .tools label { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tools button.small { padding: 4px 10px; font-size: 12px; }

  /* Players */
  .table-wrap { overflow: auto; max-height: 352px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; font-size: 12px; }
  tbody tr:hover { background: var(--panel-2); }
  td.uid { font-family: var(--mono); font-size: 12.5px; }
  .empty { color: var(--muted); padding: 28px 14px; text-align: center; }

  /* Item picker */
  button:disabled { cursor: default; opacity: .45; }
  input[type=search], input[type=number], select { width: 100%; padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); min-width: 0; }
  select:focus-visible, input[type=search]:focus-visible, input[type=number]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .item-heading { padding: 18px 20px; align-items: flex-start; }
  .item-heading h2 { font-size: 20px; letter-spacing: -.4px; }
  .item-heading p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .item-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(250px, 1fr); }
  .item-browser { padding: 18px 20px; min-width: 0; }
  .item-search-row { display: grid; grid-template-columns: minmax(0, 1fr) 100px; gap: 8px; }
  .item-categories, .item-common, .amount-presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .item-categories { margin: 12px 0; }
  .item-categories button { border-color: transparent; color: var(--muted); padding: 5px 10px; font-size: 13px; }
  .item-categories button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
  .common-label { font-size: 11px; color: var(--muted); letter-spacing: .08em; margin-bottom: 6px; }
  .item-common button { padding: 4px 9px; border-radius: 6px; font-size: 12px; }
  .item-common button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .item-results { height: 330px; overflow: auto; margin-top: 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); }
  .item-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; width: 100%; border: 0;
    border-bottom: 1px solid var(--border); border-radius: 0; text-align: left; background: transparent; }
  .item-row:last-child { border-bottom: 0; }
  .item-row[aria-pressed=true] { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
  .item-mark { display: grid; place-items: center; width: 34px; height: 38px; flex: 0 0 34px;
    border-radius: 7px; background: var(--panel-2); color: var(--muted); font-weight: 650; border-bottom: 3px solid var(--border); }
  .item-mark[data-rank="3"] { border-color: #5c94c8; } .item-mark[data-rank="4"] { border-color: #9a78c6; }
  .item-mark[data-rank="5"] { border-color: #d0a05a; }
  .item-row-text { min-width: 0; flex: 1; }
  .item-row-name { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row-meta { color: var(--muted); font: 11px/1.6 var(--mono); }
  .item-row-type { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .item-pager { display: flex; align-items: center; gap: 8px; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .item-pager span:first-child { flex: 1; } .item-pager button { padding: 3px 9px; }
  .give-form { border-left: 1px solid var(--border); background: var(--panel-2); padding: 20px; }
  .give-form fieldset { padding: 0; border: 0; margin: 0; min-width: 0; display: grid; gap: 15px; }
  .selected-item { display: flex; gap: 12px; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .selected-item .item-mark { width: 52px; height: 58px; flex-basis: 52px; font-size: 23px; background: var(--panel); }
  .selected-item h3 { margin: 0; font-size: 19px; line-height: 1.35; overflow-wrap: anywhere; }
  .selected-item p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
  .give-field label { display: block; font-size: 12px; font-weight: 550; margin-bottom: 6px; }
  .give-player-label { display: flex; align-items: center; justify-content: space-between; }
  .give-player-label button { padding: 0; border: 0; color: var(--accent); background: transparent; font-size: 12px; }
  .give-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .amount-presets { margin-top: 7px; } .amount-presets button { padding: 3px 10px; font-size: 12px; background: var(--panel); }
  #give-submit { width: 100%; padding: 12px; font-weight: 650; margin-top: 2px; }
  .give-hint { color: var(--muted); font-size: 12px; margin: 0; min-height: 36px; }
  .give-feedback { margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .give-feedback.error { color: var(--bad); border-color: var(--bad); }
  .give-feedback.processed { border-color: var(--accent); }
  .gacha-body { padding: 16px 20px; }
  .gacha-current { margin: 0 0 14px; padding: 9px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; }
  .gacha-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .gacha-picker { display: grid; gap: 8px; align-content: start; }
  #gacha-phase { padding: 4px; height: 196px; }
  #gacha-phase option { padding: 8px; border-radius: 5px; font-size: 12px; }
  .gacha-preview { min-width: 0; }
  #gacha-placeholder { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 9px; border: 1px solid var(--border); margin-bottom: 10px; }
  #gacha-placeholder.hidden { display: none; }
  #gacha-placeholder-note { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  .gacha-preview h3 { margin: 0 0 10px; font-size: 16px; }
  .gacha-preview h4 { font-size: 11px; color: var(--muted); margin: 10px 0 6px; }
  .gacha-up { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }
  .gacha-up li { font-size: 12px; border-radius: 5px; padding: 3px 8px; background: var(--panel-2); border: 1px solid var(--border); }
  #gacha-up5 li { border-color: #d0a05a; } #gacha-up4 li { border-color: #9a78c6; }
  .gacha-hint { margin: 12px 0; color: var(--muted); font-size: 12px; }
  #gacha-apply { width: 100%; padding: 9px 12px; }
  #gacha-feedback { margin: 8px 0 0; min-height: 18px; font-size: 12px; color: var(--muted); }
  #gacha-feedback.error { color: var(--bad); }
  .tool-link { color: var(--accent); text-decoration: none; font-size: 12px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; }
  #artifact-tool { scroll-margin-top: 76px; }
  #artifact-fields { border: 0; padding: 0; margin: 0; min-width: 0; }
  .artifact-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr); }
  .artifact-editor { padding: 20px; }
  .artifact-editor label, .artifact-card label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--muted); }
  .artifact-editor input[type=search] { margin-bottom: 7px; }
  .artifact-basics { display: grid; grid-template-columns: 1.2fr .8fr .8fr; gap: 10px; margin: 14px 0; }
  .artifact-sub-head, .artifact-sub-row { display: grid; grid-template-columns: minmax(110px, 1.2fr) minmax(90px, 1fr) 70px; gap: 7px; }
  .artifact-sub-head { margin-top: 18px; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
  .artifact-sub-row { margin-bottom: 8px; }
  .artifact-sub-row select, .artifact-sub-row input { padding: 7px 8px; font-size: 12px; }
  .artifact-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  .artifact-card { padding: 20px; background: var(--panel-2); border-left: 1px solid var(--border); }
  .artifact-card h3 { font-size: 21px; margin: 0 0 3px; }
  .artifact-preview-meta { color: #d0a05a; font-size: 12px; margin: 0 0 14px; }
  .artifact-main-name { font-size: 12px; color: var(--muted); }
  .artifact-main-value { font-size: 30px; font-weight: 650; margin: 1px 0 10px; font-variant-numeric: tabular-nums; }
  #artifact-preview-subs { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; min-height: 88px; }
  #artifact-preview-subs li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  #artifact-preview-subs strong { font-weight: 550; font-variant-numeric: tabular-nums; }
  #artifact-preview-status { color: var(--muted); font-size: 12px; min-height: 20px; margin: 10px 0 16px; }
  #artifact-preview-status.error { color: var(--bad); }
  .artifact-lock { display: flex !important; gap: 7px; align-items: center; margin: 12px 0 18px; }
  #artifact-give { width: 100%; padding: 11px; margin-top: 12px; }
  #artifact-give-hint { margin-top: 8px; }
  .console-nav { display:flex; gap:8px; overflow:auto; padding:10px 0 2px; }
  .console-nav a { color:var(--accent); text-decoration:none; padding:7px 12px; border:1px solid var(--border); border-radius:8px; background:var(--panel); white-space:nowrap; }
  section[id$="-tool"], #player-tools { scroll-margin-top:76px; }
  .gm-body { padding:18px 20px; }
  .gm-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px; }
  .gm-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0; }
  .gm-row > input, .gm-row > select { width:auto; flex:1; min-width:100px; }
  .gm-row > label { display:flex; gap:6px; align-items:center; }
  .gm-note { font-size:12px; color:var(--muted); margin:8px 0; }
  .gm-body fieldset { padding:0; border:0; margin:0; min-width:0; }
  .gm-body details { border-top:1px solid var(--border); margin-top:16px; padding-top:13px; }
  .gm-body summary { cursor:pointer; font-weight:650; }
  .gm-feedback { white-space:pre-wrap; font-size:12px; margin:10px 0 0; min-height:18px; overflow-wrap:anywhere; }
  .gm-feedback.error { color:var(--bad); }
  .gm-badge { display:inline-block; padding:3px 8px; border-radius:6px; background:var(--accent-soft); color:var(--accent); font-size:12px; }
  #activity-list { height:340px; }
  #activity-title-detail { margin:0 0 7px; }
  #activity-note { width:100%; min-height:65px; padding:8px; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--panel); font:inherit; }
  .activity-dates label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  input[type=datetime-local] { width:100%; padding:8px; border-radius:8px; border:1px solid var(--border); color:var(--text); background:var(--panel); font:inherit; }
  .activity-raw { max-height:220px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font-size:11px; background:var(--panel-2); padding:10px; border-radius:6px; }
  #gm-stat-table { max-height:330px; overflow:auto; margin:12px 0; border:1px solid var(--border); border-radius:8px; }
  #gm-stat-table td:first-child { white-space:normal; min-width:160px; }
  #gm-stat-table input[type=number] { width:135px; padding:5px; }
  .template-bar { padding:12px 20px; border-top:1px solid var(--border); }
  .gm-state { font:12px var(--mono); color:var(--muted); }
  @media(max-width:680px) { .gm-grid { grid-template-columns:minmax(0,1fr); } .gm-body { padding:16px; } }
  @media (max-width: 680px) {
    .artifact-layout { grid-template-columns: minmax(0, 1fr); }
    .artifact-card { border-left: 0; border-top: 1px solid var(--border); }
    .gacha-layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .item-layout { grid-template-columns: minmax(0, 1fr); }
    .give-form { border-left: 0; border-top: 1px solid var(--border); }

<body>

<section id="login">

</section>

<section id="app" class="hidden">

    </div>
    <button id="logout" type="button" data-i18n="logout"></button>
  </header>

  <main>
    <nav class="console-nav" aria-label="GM tools">
      <a href="#activity-tool" data-zh="活动档案" data-en="Events"></a><a href="#player-tools" data-zh="玩家实验台" data-en="Player lab"></a>
      <a href="#gacha-tool" data-zh="历史卡池" data-en="Wish banners"></a><a href="#item-tool" data-zh="物品发放" data-en="Items"></a><a href="#monster-tool" data-zh="刷任意怪物" data-en="Spawn monsters"></a><a href="#artifact-tool" data-zh="DIY 圣遗物" data-en="DIY artifacts"></a>
    </nav>
    <section class="panel" id="activity-tool">
      <div class="panel-head item-heading"><div><h2 data-zh="活动档案与重开" data-en="Event archive & replay"></h2><p data-zh="配置保存在服务器；关闭和重开默认保留玩家进度。" data-en="Schedules are saved on the server. Closing and reopening preserve progress."></p></div>
        <div class="tools"><button id="activity-export" type="button" data-zh="导出完整档案" data-en="Export archive"></button><button id="activity-import" type="button" data-zh="导入排期" data-en="Import schedules"></button><button id="activity-refresh" type="button" data-zh="刷新" data-en="Refresh"></button><input type="file" id="activity-file" accept=".json,application/json" class="hidden"></div></div>
      <div class="gm-body">
        <div class="gm-grid"><div>
          <input type="search" id="activity-search" placeholder="搜索活动名称、ID 或类型" aria-label="搜索活动">
          <div class="gm-row"><select id="activity-filter" aria-label="活动过滤"><option value="configured" data-zh="已配置的活动" data-en="Configured"></option><option value="all" data-zh="全部活动资料" data-en="All definitions"></option><option value="open" data-zh="当前已开启" data-en="Open now"></option><option value="music" data-zh="已有音游处理器" data-en="Music handler available"></option><option value="entry" data-zh="缺少专用玩法" data-en="Gameplay missing"></option></select><span id="activity-count" class="meta"></span></div>
          <select id="activity-list" size="12" aria-label="活动档案列表"></select>
          <p class="gm-note" data-zh="401 条资料不等于 401 个可玩活动。音游有专用处理器，角色试用未完成，其余主要是资料和入口；旧资源缺失也会影响重玩。" data-en="Definitions are not playable implementations. Music has a handler, trials are partial, and other events mainly have metadata/entries. Missing old assets can prevent replay."></p>
        </div><div>
          <h3 id="activity-title-detail">—</h3><div id="activity-badges" class="gm-row"></div><p id="activity-support" class="gm-note"></p>
          <fieldset id="activity-fields" disabled>
            <div class="gm-row"><label for="activity-days" data-zh="重开时长" data-en="Reopen for"></label><select id="activity-days"><option value="1">1 天 / day</option><option value="7" selected>7 天 / days</option><option value="30">30 天 / days</option><option value="0" data-zh="长期（至 2099 年）" data-en="Long term (through 2099)"></option></select></div>
            <div class="gm-row"><label><input type="checkbox" id="activity-unlock"><span data-zh="解锁活动阶段条件（不自动领奖）" data-en="Unlock stage conditions (no auto-claim)"></span></label></div>
            <div class="gm-row" id="activity-entry-row"><label><input type="checkbox" id="activity-entry"><span data-zh="已知玩法不完整，仅尝试开启入口" data-en="Try entry despite incomplete gameplay"></span></label></div>
            <div class="gm-row"><button type="button" class="primary" id="activity-open" data-zh="开启 / 重新开启" data-en="Open / reopen"></button><button type="button" id="activity-close" data-zh="关闭活动" data-en="Close"></button></div>
            <details><summary data-zh="自定义排期与备注" data-en="Schedule & notes"></summary><div class="gm-grid activity-dates" style="margin-top:10px"><div><label for="activity-begin" data-zh="开始时间（本地时区）" data-en="Start (local time)"></label><input type="datetime-local" id="activity-begin"></div><div><label for="activity-end" data-zh="结束时间" data-en="End"></label><input type="datetime-local" id="activity-end"></div></div>
              <div class="gm-row"><button type="button" id="activity-schedule" data-zh="应用排期" data-en="Apply schedule"></button></div><label for="activity-note" class="gm-note" data-zh="存档备注" data-en="Archive notes"></label><textarea id="activity-note" maxlength="1000"></textarea><div class="gm-row"><button type="button" id="activity-save" data-zh="保存备注与解锁设置" data-en="Save notes & unlock settings"></button></div></details>
            <details><summary data-zh="玩家进度与重玩" data-en="Player progress & reset"></summary><div class="gm-row"><select id="activity-player" aria-label="活动玩家"></select><button type="button" id="activity-progress" data-zh="查看进度" data-en="View progress"></button><button type="button" id="activity-reset" data-zh="清空此活动进度" data-en="Reset event progress"></button></div><p class="gm-note" data-zh="重置只影响所选在线玩家的此活动记录和领奖标记，不收回已领取的物品；需要重新进入活动界面。" data-en="Reset clears only this online player's event progress and claim markers. Granted items remain. Re-enter the event screen."></p><pre id="activity-progress-detail" class="activity-raw">—</pre></details>
          </fieldset>
          <details><summary data-zh="查看原始定义、奖励与资源依赖" data-en="Definition, rewards & resource dependencies"></summary><pre id="activity-raw" class="activity-raw">—</pre></details>
          <details open><summary data-zh="可恢复活动包" data-en="Restorable event package"></summary><p id="activity-assets-status" class="gm-note">—</p><p id="activity-assets-path" class="gm-note"></p>
            <div class="gm-row"><button type="button" id="activity-assets-save" data-zh="保存 / 更新活动包" data-en="Save / update package"></button><button type="button" id="activity-assets-restore" data-zh="恢复原始资源" data-en="Restore original files"></button><button type="button" id="activity-assets-load" data-zh="载入已存活动设置" data-en="Load saved settings"></button><button type="button" id="activity-assets-refresh" data-zh="刷新恢复结果" data-en="Refresh restore result"></button></div>
            <p class="gm-note" data-zh="恢复流程：退出游戏 → 恢复原始资源（Windows 管理员确认）→ 如有服务端资源则重启服务器 → 载入已存设置 → 上方重新开启。资源包限定相同 7.1.0 客户端，未实现玩法及缺失依赖仍需补齐。移动资源包时需同时带上 files 共享目录。" data-en="Restore: exit game → restore original files (Windows admin approval) → restart server for server resources → load saved settings → reopen above. Requires the same 7.1.0 client; missing gameplay/dependencies still need implementation. Keep the shared files directory with packages."></p>
          </details>
        </div></div><p id="activity-feedback" class="gm-feedback" role="status"></p>
      </div>
    </section>
    <section class="panel" id="player-tools">
      <div class="panel-head item-heading"><div><h2 data-zh="玩家实验台" data-en="Player lab"></h2><p data-zh="选择在线玩家，调整角色、战斗数值与世界；操作会立即生效。" data-en="Choose an online player to edit characters, combat stats and world settings."></p></div><div class="tools"><button id="gm-refresh" type="button" data-zh="刷新实际状态" data-en="Refresh state"></button></div></div>
      <div class="gm-body">
        <div class="gm-row"><label for="gm-player" data-zh="目标玩家" data-en="Player"></label><select id="gm-player"></select><span class="gm-state" id="gm-position">—</span></div>
        <fieldset id="gm-fields" disabled>
          <div class="gm-row"><span id="gm-oculi-summary" class="gm-state">—</span><button type="button" id="gm-collect-oculi" data-zh="一键收集当前地区神瞳" data-en="Collect current country's oculi"></button></div>
          <p class="note" data-zh="按角色所在国家收集本机资源已索引的未收神瞳，物品入包并保存地图进度；不会自动供奉神像。" data-en="Collect unclaimed oculi indexed in local resources for the current country, and save map progress. Statues are not upgraded automatically."></p>
          <div class="gm-row"><button type="button" data-gm-action="heal" data-zh="全角色回血 / 复活" data-en="Heal & revive all"></button><button type="button" data-gm-action="energy" data-zh="队伍回满能量" data-en="Refill team energy"></button><button type="button" data-gm-action="restore" data-zh="队伍状态全恢复" data-en="Restore team"></button></div>
          <div class="gm-row"><label><input type="checkbox" data-gm-flag="godmode"><span data-zh="无敌" data-en="God mode"></span></label><label><input type="checkbox" data-gm-flag="unlimitedStamina"><span data-zh="无限体力" data-en="Unlimited stamina"></span></label><label><input type="checkbox" data-gm-flag="unlimitedEnergy"><span data-zh="无限能量" data-en="Unlimited energy"></span></label><label><input type="checkbox" data-gm-flag="timeLocked"><span data-zh="锁定世界时间" data-en="Freeze world clock"></span></label></div>
          <details open><summary data-zh="角色培养与自定义战斗数值" data-en="Character & custom combat stats"></summary>
            <div class="gm-row"><label for="gm-avatar" data-zh="拥有的角色" data-en="Owned character"></label><select id="gm-avatar"></select></div>
            <div class="gm-grid"><div><div class="gm-row"><label for="gm-constellation" data-zh="命座 0–6" data-en="Constellation 0–6"></label><input type="number" id="gm-constellation" min="0" max="6" step="1" value="6"><button type="button" id="gm-set-constellation" data-zh="设置" data-en="Set"></button></div><div class="gm-row"><label for="gm-talent" data-zh="三天赋 1–10" data-en="All talents 1–10"></label><input type="number" id="gm-talent" min="1" max="10" step="1" value="10"><button type="button" id="gm-set-talent" data-zh="设置" data-en="Set"></button></div></div>
            <div><div class="gm-row"><label for="gm-friendship" data-zh="好感 1–10" data-en="Friendship 1–10"></label><input type="number" id="gm-friendship" min="1" max="10" step="1" value="10"><button type="button" id="gm-set-friendship" data-zh="设置" data-en="Set"></button></div><div class="gm-row"><button type="button" id="gm-max-avatar" data-zh="当前选中角色与武器拉满" data-en="Max selected character & weapon"></button></div></div></div>
            <p class="gm-note" data-zh="勾选并填入要覆盖的数值；百分比直接填 100 代表 100%。数值覆盖随角色保存，恢复按钮会重新按装备计算。客户端动画、冷却等限制可能仍存在。" data-en="Check stats to override. Enter 100 for 100%. Overrides persist on this character; restore recalculates from equipment. Client animation/cooldown limits may still apply."></p>
            <div id="gm-stat-table"><table><thead><tr><th data-zh="覆盖 / 属性" data-en="Override / stat"></th><th data-zh="实际值" data-en="Current"></th><th data-zh="目标值" data-en="Target"></th><th></th></tr></thead><tbody id="gm-stats"></tbody></table></div>
            <div class="gm-row"><button type="button" class="primary" id="gm-apply-stats" data-zh="应用勾选数值" data-en="Apply checked stats"></button><button type="button" id="gm-reset-stats" data-zh="清除该角色全部数值覆盖" data-en="Restore all character stats"></button></div>
            <div class="gm-row"><input id="gm-build-name" type="text" maxlength="60" placeholder="配置名称（保存在本浏览器）"><button type="button" id="gm-save-build" data-zh="保存数值模板" data-en="Save stat preset"></button></div><div class="gm-row"><select id="gm-build-list" aria-label="数值模板"></select><button type="button" id="gm-load-build" data-zh="载入到表单" data-en="Load into form"></button><button type="button" id="gm-delete-build" data-zh="删除模板" data-en="Delete preset"></button></div>
          </details>
          <details><summary data-zh="世界时间、难度与树脂" data-en="World time, difficulty & resin"></summary><div class="gm-grid">
            <div><div class="gm-row"><label for="gm-world-level" data-zh="世界等级 0–9" data-en="World level 0–9"></label><input type="number" id="gm-world-level" min="0" max="9" step="1"><button type="button" id="gm-set-world-level" data-zh="设置" data-en="Set"></button></div><div class="gm-row"><label for="gm-resin" data-zh="原粹树脂 0–2000" data-en="Original resin 0–2000"></label><input type="number" id="gm-resin" min="0" max="2000" step="1"><button type="button" id="gm-set-resin" data-zh="设置" data-en="Set"></button></div></div>
            <div><div class="gm-row"><input type="time" id="gm-time" aria-label="世界时间"><button type="button" id="gm-set-time" data-zh="调整时间" data-en="Set time"></button></div><div class="gm-row"><button type="button" data-gm-time="360" data-zh="清晨 06:00" data-en="06:00"></button><button type="button" data-gm-time="720" data-zh="正午 12:00" data-en="12:00"></button><button type="button" data-gm-time="1080" data-zh="傍晚 18:00" data-en="18:00"></button><button type="button" data-gm-time="0" data-zh="午夜 00:00" data-en="00:00"></button></div><p class="gm-note" data-zh="时间及锁定对同一世界的玩家共同生效。世界等级变更后，已有怪物可能需重新加载场景。" data-en="Time changes affect everyone in this world. Reload the scene for existing enemies after changing world level."></p></div>
          </div></details>
          <details><summary data-zh="传送与地点收藏" data-en="Teleport & saved locations"></summary><div class="gm-row"><label>Scene <input type="number" id="gm-scene" min="1" step="1"></label><label>X <input type="number" id="gm-x" step="any"></label><label>Y <input type="number" id="gm-y" step="any"></label><label>Z <input type="number" id="gm-z" step="any"></label></div>
            <div class="gm-row"><button type="button" id="gm-use-position" data-zh="填入当前坐标" data-en="Use current position"></button><button type="button" id="gm-teleport" data-zh="传送至此坐标" data-en="Teleport here"></button></div>
            <div class="gm-row"><input type="text" id="gm-location-name" maxlength="60" placeholder="地点名称（保存在本浏览器）"><button type="button" id="gm-save-location" data-zh="收藏地点" data-en="Save location"></button></div><div class="gm-row"><select id="gm-location-list" aria-label="收藏地点"></select><button type="button" id="gm-load-location" data-zh="载入坐标" data-en="Load location"></button><button type="button" id="gm-delete-location" data-zh="删除地点" data-en="Delete location"></button></div>
          </details>
        </fieldset><p id="gm-feedback" class="gm-feedback" role="status"></p>
      </div>
    </section>
    <section class="panel" id="recharge-tool" aria-labelledby="recharge-title">
      <div class="panel-head item-heading"><div><h2 id="recharge-title" data-zh="本地模拟充值" data-en="Local simulated recharge"></h2><p data-zh="免费按商品到账，更新游戏内余额、月卡及纪行。" data-en="Free product delivery to the game, monthly card and battle pass."></p></div><button type="button" id="recharge-refresh" data-zh="刷新商品" data-en="Refresh products"></button></div>
      <div class="gacha-body"><div class="gm-toolbar">
        <label for="recharge-player" data-zh="在线玩家" data-en="Online player"></label><select id="recharge-player" aria-label="充值玩家"></select>
        <label for="recharge-product" data-zh="充值商品" data-en="Product"></label><select id="recharge-product" aria-label="充值商品"></select>
        <button type="button" class="primary" id="recharge-buy" disabled data-zh="免费充值并到账" data-en="Recharge for free"></button>
      </div><p id="recharge-preview" class="gacha-hint"></p><p id="recharge-feedback" class="gm-feedback" role="status"></p></div>
    </section>
    <section class="panel" id="gacha-tool" aria-labelledby="gacha-title">
      <div class="panel-head item-heading">
        <div><h2 id="gacha-title" data-i18n="gachaTitle"></h2><p data-i18n="gachaSubtitle"></p></div>
        <div class="tools"><button type="button" class="small" id="gacha-refresh" data-i18n="gachaRefresh"></button></div>
      </div>
      <div class="gacha-body">
        <p class="gacha-current" id="gacha-current" aria-live="polite"></p>
        <div class="gacha-layout">
          <div class="gacha-picker">
            <input type="search" id="gacha-search" data-i18n-placeholder="gachaSearch" aria-label="搜索历史卡池" autocomplete="off">
            <select id="gacha-phase" size="6" aria-label="历史卡池" disabled></select>
            <span class="meta" id="gacha-count"></span>
          </div>
          <div class="gacha-preview">
            <h3 id="gacha-preview-title"></h3>
            <img id="gacha-placeholder" class="hidden" alt="卡池占位展示" src="/console/assets/gacha-placeholder.png">
            <p id="gacha-placeholder-note" class="hidden"></p>
            <h4 data-i18n="gachaUp5"></h4><ul class="gacha-up" id="gacha-up5"></ul>
            <h4 data-i18n="gachaUp4"></h4><ul class="gacha-up" id="gacha-up4"></ul>
            <p class="gacha-hint" data-i18n="gachaHint"></p>
            <button type="button" class="primary" id="gacha-apply" disabled data-i18n="gachaApply"></button>
            <p id="gacha-feedback" role="status"></p>
          </div>
        </div>
      </div>
    </section>
    <section class="panel" id="monster-tool" aria-labelledby="monster-title">
      <div class="panel-head item-heading">
        <div><h2 id="monster-title" data-zh="刷任意怪物" data-en="Spawn monsters"></h2><p data-zh="按名称或 ID 找怪物，在选定玩家前方生成。" data-en="Find a monster by name or ID and spawn it in front of an online player."></p></div>
        <div class="tools"><span class="meta" id="monster-version"></span><button type="button" id="monster-reload" data-zh="刷新怪物" data-en="Reload monsters"></button></div>
      </div>
      <div class="item-layout">
        <div class="item-browser">
          <input type="search" id="monster-search" placeholder="搜索中文名称、英文名称或怪物 ID…" aria-label="搜索怪物" autocomplete="off">

          <div class="item-common" id="monster-common"></div>
          <div class="item-results" id="monster-results" aria-label="怪物搜索结果"></div>

          <p class="gm-note" data-zh="包括当前服务端怪物表中的全部 ID 和内部变体；未收录中文名的条目显示内部名和 ID。特殊首领的阶段玩法仍依赖原场景脚本。" data-en="Lists every loaded monster ID, including internal variants. Unnamed entries show internal names and IDs. Special boss phases still depend on scene scripts."></p>

          </fieldset><p class="gm-feedback" id="monster-feedback" role="status" aria-live="polite"></p>

      </div>

    <section class="panel" id="item-tool" aria-labelledby="item-title">
      <div class="panel-head item-heading">
        <div><h2 id="item-title" data-i18n="itemTitle"></h2><p data-i18n="itemSubtitle"></p></div>
        <div class="tools"><span class="meta" id="item-version"></span><button type="button" class="small" id="item-reload" data-i18n="reloadItems"></button></div>
      </div>
      <div class="item-layout">

  // Lines arrive as "HH:mm:ss <LEVEL:Logger> message".
  const LOG_LINE = /^(\d\d:\d\d:\d\d) <(\w+):([^>]*)> ([\s\S]*)$/;

  function visible(row) {

    ["time", "lvl " + level, "msg"].forEach((cls, i) => {
      const span = document.createElement("span");
      span.className = cls;

  function matchingItems() {
    const query = $("item-search").value.trim().toLocaleLowerCase();
    const rank = $("item-rarity").value;
    return itemCatalog.filter((item) =>
      (!$('item-favorites-only').checked || itemFavorites.has(item.id)) &&
      (itemCategory === "all" || item.category === itemCategory) &&
      (rank === "all" || item.rank === Number(rank)) &&
      (!query || String(item.id).includes(query) || item.name.toLocaleLowerCase().includes(query) || item.en.toLocaleLowerCase().includes(query))
    ).sort((a, b) => {
      const score = (item) => !query ? (item.named ? 0 : 1) : String(item.id) === query ? -2 : item.name.toLocaleLowerCase() === query || item.en.toLocaleLowerCase() === query ? -1 : item.named ? 0 : 1;
      return score(a) - score(b) || a.id - b.id;

      $("monster-level").min = body.levels[0] || 1;
      $("monster-level").max = body.levels.at(-1) || 1;
      if (!monsterLevels.has(Number($("monster-level").value))) $("monster-level").value = monsterLevels.has(90) ? 90 : body.levels[0] || 1;
      renderMonsterFilters(); renderMonsterSelection();
    } catch (e) { monsterLoaded = false; message("monster-feedback", e.message, true); }
    finally { monsterLoading = false; renderMonsterResults(); updateMonsterAvailability(); }
  }
  $("monster-search").addEventListener("input", () => { monsterPage = 0; renderMonsterResults(); });
  $("monster-type").addEventListener("change", () => { monsterPage = 0; renderMonsterResults(); });
  $("monster-prev").addEventListener("click", () => { monsterPage--; renderMonsterResults(); });
  $("monster-next").addEventListener("click", () => { monsterPage++; renderMonsterResults(); });
  $("monster-reload").addEventListener("click", refreshMonsters);
  $("monster-player-refresh").addEventListener("click", refreshPlayers);
  $("monster-player").addEventListener("change", updateMonsterAvailability);
  document.querySelectorAll("[data-monster-amount]").forEach(button => button.addEventListener("click", () => { $("monster-amount").value = button.dataset.monsterAmount; }));
  $("monster-form").addEventListener("submit", async event => {
    event.preventDefault();
    const uid = Number($("monster-player").value), amount = Number($("monster-amount").value),
      level = Number($("monster-level").value), distance = Number($("monster-distance").value), monster = monsterSelected;
    if (monsterBusy || !monster || !playersReady || !onlinePlayers.some(player => player.uid === uid)) return;
    if (!Number.isSafeInteger(amount) || amount < 1 || amount > 2147483647 || !monsterLevels.has(level)
      || !Number.isFinite(distance) || distance < 0 || distance > 100) {
      message("monster-feedback", text2("请填写正整数数量、资源支持的等级及 0–100 米距离。", "Enter a positive integer quantity, a supported level and a distance from 0 to 100 meters."), true); return;
    }
    monsterBusy = true; updateMonsterAvailability(); message("monster-feedback", text2("正在生成…", "Spawning…"));
    try {
      const result = await getJSON("/console/api/monsters/spawn", {method:"POST", body:JSON.stringify({uid, monsterId:monster.id, amount, level, distance})});
      const heading = result.spawned === 0
        ? text2(`未生成怪物（请求 ${result.requested} 个 ${monsterName(monster)}，场景 ${result.sceneId}）。`,
          `No monsters spawned (requested ${result.requested} ${monsterName(monster)}, scene ${result.sceneId}).`)
        : text2(`已实际生成 ${result.spawned} / ${result.requested} 个 ${monsterName(monster)}（等级 ${level}，场景 ${result.sceneId}）。`,
          `Spawned ${result.spawned} / ${result.requested} ${monsterName(monster)} (level ${level}, scene ${result.sceneId}).`);
      message("monster-feedback", heading + (result.output?.length ? "\n" + result.output.join("\n") : ""), result.spawned !== result.requested);
    } catch (e) { message("monster-feedback", `${e.message}\n${text2("请求没有自动重发；请先在游戏中确认实际怪物数量。", "The request was not retried. Check the actual monsters in game before spawning again.")}`, true); }
    finally { monsterBusy = false; updateMonsterAvailability(); }
  });

  applyLanguage();
  if (token) showApp(); else showLogin();
})();
</script>
</body>
</html>
